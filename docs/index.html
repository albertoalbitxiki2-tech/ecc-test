<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Die rote Linie</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Special+Elite&display=swap">
<style id="css">
:root{
  --paper:#EFE3C8; --paper-2:#E5D5B2; --paper-3:#D8C49C;
  --sea:#BAC7BE; --sea-2:#A3B4AB;
  --land:#EDDFBE; --land-2:#DFD1B1;
  --ink:#33251A; --ink-2:#6B5741; --ink-3:#9A8466;
  --red:#B3121B; --red-soft:rgba(179,18,27,.38);
  --f-display:"IM Fell English SC","IM Fell English",Georgia,serif;
  --f-map:"IM Fell English",Georgia,serif;
  --f-body:"Crimson Pro",Georgia,"Times New Roman",serif;
  --f-type:"Special Elite","Courier New",Courier,monospace;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 var(--f-body)}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
#root{height:100%}
.app{display:grid;grid-template-columns:minmax(0,1fr) 380px;height:100%}
.stage{position:relative;overflow:hidden;background:var(--sea);min-height:420px}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#map:active{cursor:grabbing}
.picking #map{cursor:crosshair}
.grain,.vignette{position:absolute;inset:0;pointer-events:none}
.grain{opacity:.22;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .25 0 0 0 0 .12 0 0 0 .9 0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>")}
.vignette{background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(70,45,20,.38) 100%)}

.cartouche{position:absolute;top:16px;left:16px;max-width:calc(100% - 32px);padding:12px 18px 12px;background:rgba(239,227,200,.92);border:1px solid var(--ink-2);box-shadow:0 0 0 3px rgba(239,227,200,.92),0 0 0 4px var(--ink-2),0 6px 18px rgba(50,30,10,.18)}
.cartouche .eyebrow{font:12px/1 var(--f-type);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.cartouche h1{margin:6px 0 4px;font:400 clamp(24px,3.2vw,36px)/1.05 var(--f-display);letter-spacing:.02em;text-wrap:balance}
.cartouche h1 em{font-family:var(--f-map);font-style:italic;color:var(--red)}
.cartouche .sub{font:14px/1.3 var(--f-type);color:var(--ink-2)}
.compass{position:absolute;right:18px;top:18px;width:74px;height:74px;pointer-events:none;opacity:.8}
.mapctl{position:absolute;left:16px;bottom:16px;display:flex;gap:8px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--ink);background:rgba(239,227,200,.94);padding:7px 12px;font:13px/1 var(--f-type);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:var(--ink)}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn:focus-visible,.lnk:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.btn.red{background:var(--red);border-color:var(--red);color:#F7EEDC}
.btn.red:hover{background:#8E0E15}
.pickhint{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 14px;font:14px/1.3 var(--f-type);display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.pickhint .lnk{color:var(--paper)}

/* map marks */
.grat{fill:none;stroke:var(--ink-2);stroke-opacity:.16;stroke-width:.6}
.coastwash{fill:none;stroke:var(--sea-2);stroke-width:9;stroke-opacity:.55;stroke-linejoin:round}
.country{fill:var(--land-2);stroke:none}
.country.focus{fill:var(--land)}
.coast{fill:none;stroke:var(--ink-2);stroke-width:.8;stroke-opacity:.8}
.borders{fill:none;stroke:var(--ink-2);stroke-width:.9;stroke-dasharray:4 2 1 2;stroke-opacity:.75}
.clabel{font-family:var(--f-display);fill:var(--ink-2);fill-opacity:.55;text-anchor:middle;letter-spacing:.35em}
.olabel{font-family:var(--f-map);font-style:italic;fill:#4E6A66;fill-opacity:.7;text-anchor:middle;letter-spacing:.3em}
.seg-next{fill:none;stroke:var(--red);stroke-opacity:.5;stroke-linecap:round}
.seg-glow{fill:none;stroke:var(--red-soft);stroke-linecap:round;filter:url(#blur)}
.seg-done{fill:none;stroke:var(--red);stroke-linecap:round}
.stopdot{fill:var(--paper);stroke:var(--ink);stroke-width:1.4}
.stop.done .stopdot{fill:var(--red);stroke:#5E0A0E}
.stop.pending .stopdot{fill:var(--paper);stroke:var(--ink)}
.ring{fill:none;stroke:var(--red);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.4);opacity:0}}
.slabel{font-family:var(--f-map);font-size:14px;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:3.5px;stroke-linejoin:round}
.stop.current .slabel{fill:var(--red);font-size:16px}
.here{font-family:var(--f-type);font-size:10px;letter-spacing:.12em;fill:var(--ink-2);paint-order:stroke;stroke:var(--paper);stroke-width:3px;text-transform:uppercase}
.stop{cursor:pointer}
.plane path{fill:var(--ink);stroke:var(--paper);stroke-width:.8}
.plane circle{fill:var(--red)}

/* logbook */
.log{background:var(--paper);border-left:1px solid var(--paper-3);display:flex;flex-direction:column;min-height:0;overflow:auto;padding-inline:20px;padding-block:18px 28px;gap:18px}
.log-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:8px}
.log-head h2{margin:0;font:400 26px/1 var(--f-display);letter-spacing:.04em}
.status{font:12px/1.2 var(--f-type);color:var(--ink-2);text-align:right}
.status.warn{color:var(--red)}
.note-box{border:1px dashed var(--ink-3);padding:10px 12px;font-size:15px;display:flex;flex-direction:column;gap:8px}
.note-box .row{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:.8fr 1.4fr 1fr;gap:10px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .k{font:11px/1.2 var(--f-type);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.stat .v{font:20px/1.1 var(--f-type);font-variant-numeric:tabular-nums}
.stat .v small{font-size:14px;color:var(--ink-2)}
.strip{grid-column:1/-1;position:relative;height:18px;margin-top:4px}
.strip svg{width:100%;height:18px;display:block;overflow:visible}
.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stops li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:4px 10px;align-items:start;padding:10px 0;border-bottom:1px dotted var(--ink-3)}
.stops .n{font:14px/1.6 var(--f-type);color:var(--ink-3);font-variant-numeric:tabular-nums}
.stops li.done .n{color:var(--red)}
.stops li.current{background:linear-gradient(90deg,rgba(179,18,27,.08),transparent 80%)}
.stops .name{font:600 17px/1.25 var(--f-body);cursor:pointer;background:none;border:0;padding:0;text-align:left}
.stops li.done .name{color:var(--ink-2)}
.stops li.current .name{color:var(--red)}
.stops .meta{font:12px/1.4 var(--f-type);color:var(--ink-2);margin-top:2px}
.stops .txt{font-style:italic;font-size:15px;color:var(--ink-2);margin-top:2px}
.stops .here-tag{font:11px/1 var(--f-type);letter-spacing:.1em;text-transform:uppercase;color:var(--paper);background:var(--red);padding:3px 6px;margin-left:6px;vertical-align:2px}
.acts{display:flex;gap:4px;align-items:center}
.lnk{appearance:none;border:0;background:none;padding:3px 5px;font:12px/1 var(--f-type);color:var(--ink-2);cursor:pointer;text-transform:uppercase;letter-spacing:.06em}
.lnk:hover{color:var(--red)}
.lnk:disabled{opacity:.3;cursor:default}
.lnk.danger{color:var(--red)}
.edit{grid-column:2/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.edit .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:3px;font:11px/1.2 var(--f-type);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);min-width:0}
input.i,select.i{background:#F7EEDA;border:1px solid var(--ink-3);padding:7px 8px;font:15px/1.2 var(--f-body);text-transform:none;letter-spacing:0;width:100%;min-width:0;border-radius:0}
.add{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:2px solid var(--ink);padding-top:14px}
.add h3{grid-column:1/-1;margin:0;font:400 20px/1 var(--f-display);letter-spacing:.04em}
.add .full{grid-column:1/-1}
.add .hint{grid-column:1/-1;font-size:14px;color:var(--ink-2);margin:0}
.empty{font-style:italic;color:var(--ink-2);padding:12px 0}
.ro .w{display:none!important}
@media (max-width:860px){
  .app{display:block;height:auto}
  .stage{height:66vh}
  .log{border-left:0;border-top:2px solid var(--ink);overflow:visible}
  .compass{width:54px;height:54px;top:auto;bottom:16px;right:16px}
}
@media (prefers-reduced-motion:reduce){.ring{animation:none}}
</style>
</head>

    <div class="mapctl">

      <button class="btn" id="btn-fit" type="button">Ganze Karte</button>
    </div>
    <div class="pickhint" id="pickhint" hidden><span>Klickt auf die Karte, wo <b id="pickname"></b> liegt.</span><button class="lnk" id="pickcancel" type="button">Abbrechen</button></div>
  </section>
  <aside class="log">
    <div class="log-head"><h2>Logbuch</h2><div class="status" id="status" aria-live="polite"></div></div>
    <div class="note-box w" id="example" hidden>
      <div>Das ist eine <b>Beispielroute</b>. Ändert sie oder leert sie und tragt eure eigenen Stopps ein.</div>
      <div class="row"><button class="btn" id="ex-keep" type="button">Beispiel behalten</button><button class="btn" id="ex-clear" type="button">Route leeren</button></div>
    </div>
    <div class="stats" id="stats"></div>
    <ol class="stops" id="list"></ol>
    <form class="add w" id="addform" autocomplete="off">
      <h3>Stopp hinzufügen</h3>
      <label class="f full">Ort<input class="i" id="f-name" list="places" placeholder="z. B. Valparaíso" required></label>
      <label class="f">Ankunft<input class="i" id="f-date" type="date"></label>
      <label class="f">Anreise<select class="i" id="f-mode"></select></label>
      <label class="f full">Notiz<input class="i" id="f-note" placeholder="optional"></label>
      <p class="hint">Unbekannter Ort? Nach dem Hinzufügen klickt ihr einfach auf die Karte.</p>
      <button class="btn red full" type="submit">Auf die Route setzen</button>
      <datalist id="places"></datalist>
    </form>
  </aside>
</div>
</template>

function arc(a,b,mode){
  var dx=b[0]-a[0],dy=b[1]-a[1],k=mode==='flight'?0.2:0.06;
  var mx=(a[0]+b[0])/2-dy*k,my=(a[1]+b[1])/2+dx*k;
  return 'M'+a[0]+','+a[1]+'Q'+mx+','+my+' '+b[0]+','+b[1];
}

function drawRoute(){

  var segs=[];for(var i=1;i<st.length;i++)segs.push({i:i,d:arc(P[i-1],P[i],st[i].mode),mode:st[i].mode,done:i<=cur});

  zg.select('.r-glow').selectAll('path').data(segs.filter(function(s){return s.done})).join('path').attr('class','seg-glow').attr('d',function(s){return s.d});

    return s;
  });
  g.order();

   .attr('transform',function(d,i){return 'translate('+P[i]+')'});

}

  zg.selectAll('.seg-done').attr('stroke-width',3.2/k);
  zg.selectAll('.seg-glow').attr('stroke-width',8/k);
  zg.selectAll('.seg-next').attr('stroke-width',1.7/k).attr('stroke-dasharray',(7/k)+' '+(5/k));
  zg.selectAll('.coastwash').attr('stroke-width',9/Math.sqrt(k));
  zg.selectAll('.coast').attr('stroke-width',.8/Math.sqrt(k));
  zg.selectAll('.borders').attr('stroke-width',.9/Math.sqrt(k));
  zg.selectAll('.stop .inner').attr('transform','scale('+(1/k)+')');
  var pl=zg.select('.plane');if(pl.attr('data-t'))pl.attr('transform',pl.attr('data-t')+' scale('+(1/k)+')');
}

function placeLabels(){
  var st=state.stops,cur=state.current,boxes=[];
  if(P.length!==st.length)return;
  var nodes=stopNodeList();
  var order=st.map(function(s,i){return i}).sort(function(a,b){
    function pr(i){return i===cur?-1000:(i<=cur?-i:i+100)}return pr(a)-pr(b)});
  st.forEach(function(s,i){var p=zt.apply(P[i]);boxes.push({x:p[0]-6,y:p[1]-6,w:12,h:12})});
  order.forEach(function(i){
    var p=zt.apply(P[i]),fs=i===cur?16:14,w=st[i].name.length*fs*0.48+4,h=i===cur?32:16;
    var cands=[{x:p[0]+10,a:'start',tx:10},{x:p[0]-10-w,a:'end',tx:-10}];
    var hit=null;
    for(var c=0;c<cands.length;c++){
      var b={x:cands[c].x,y:p[1]-(i===cur?24:8),w:w,h:h};
      if(b.x<4||b.x+b.w>W-4)continue;
      var ov=boxes.some(function(o){return b.x<o.x+o.w&&b.x+b.w>o.x&&b.y<o.y+o.h&&b.y+b.h>o.y});
      if(!ov){hit=cands[c];boxes.push(b);break}
    }
    var n=d3.select(nodes[i]);
    n.selectAll('.slabel,.here').attr('display',hit?null:'none');
    if(hit)n.selectAll('.slabel,.here').attr('x',hit.tx).attr('text-anchor',hit.a);
  });
}

function fit(){svg.transition().duration(700).call(zoom.transform,d3.zoomIdentity)}
function focusStop(i){
  if(i<0||!P[i])return;var k=Math.max(zt.k,4);
  svg.transition().duration(800).call(zoom.transform,d3.zoomIdentity.translate(W/2,H/2).scale(k).translate(-P[i][0],-P[i][1]));
}

/* ---------- the film moment ---------- */
function stopAnim(){if(anim){cancelAnimationFrame(anim.raf);anim=null}
  zg.select('.plane').attr('opacity',0).attr('data-t',null);
  zg.selectAll('.stop.pending').classed('pending',false);
  zg.selectAll('.seg-done,.seg-glow').attr('stroke-dasharray',null).attr('stroke-dashoffset',null);
  zg.selectAll('.stop .ring').style('visibility',null);
}
function play(){
  stopAnim();
  var cur=state.current;if(cur<1)return;
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var done=zg.selectAll('.seg-done').nodes(),glow=zg.selectAll('.seg-glow').nodes(),data=zg.selectAll('.seg-done').data();
  if(!done.length)return;
  var L=done.map(function(n){return n.getTotalLength()});
  var w=L.map(function(l){return Math.sqrt(l)+6}),sw=w.reduce(function(a,b){return a+b},0);
  var total=Math.min(12000,Math.max(2600,done.length*850));
  var dur=w.map(function(x){return total*x/sw}),starts=[],acc=0;dur.forEach(function(d){starts.push(acc);acc+=d});
  done.forEach(function(n,j){n.setAttribute('stroke-dasharray',L[j]+' '+L[j]);n.setAttribute('stroke-dashoffset',L[j]);glow[j].setAttribute('stroke-dasharray',L[j]+' '+L[j]);glow[j].setAttribute('stroke-dashoffset',L[j])});
  var stopNodes=stopNodeList();
  stopNodes.forEach(function(n,i){if(n&&i>0&&i<=cur)n.classList.add('pending')});
  zg.selectAll('.stop .ring').style('visibility','hidden');
  var plane=zg.select('.plane'),t0=performance.now();
  plane.attr('opacity',1);
  function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
  function frame(now){
    var el=now-t0;
    for(var j=0;j<done.length;j++){
      var f=Math.min(1,Math.max(0,(el-starts[j])/dur[j])),e=ease(f);
      done[j].setAttribute('stroke-dashoffset',L[j]*(1-e));glow[j].setAttribute('stroke-dashoffset',L[j]*(1-e));
      if(f>0&&f<1){
        var p=done[j].getPointAtLength(L[j]*e),q=done[j].getPointAtLength(Math.min(L[j],L[j]*e+1)),p0=done[j].getPointAtLength(Math.max(0,L[j]*e-1));
        var ang=Math.atan2(q.y-p0.y,q.x-p0.x)*180/Math.PI,fl=data[j].mode==='flight';
        var tr='translate('+p.x+','+p.y+') rotate('+ang+')';
        plane.attr('data-t',tr).attr('transform',tr+' scale('+(1/zt.k)+')');
        plane.select('path').attr('display',fl?null:'none');plane.select('circle').attr('display',fl?'none':null);
      }
      if(f>=1&&stopNodes[data[j].i])stopNodes[data[j].i].classList.remove('pending');
    }
    if(el<total){anim.raf=requestAnimationFrame(frame)}else{anim=null;stopAnim()}
  }
  anim={raf:requestAnimationFrame(frame)};
}

svg.on('click',function(e){
  if(!pick)return;
  var m=d3.pointer(e,svg.node()),xy=zt.invert(m),ll=proj.invert(xy);
  var s=pick;pick=null;stage.classList.remove('picking');$('pickhint').hidden=true;
  s.lat=Math.round(ll[1]*100)/100;s.lon=Math.round(ll[0]*100)/100;
  change(function(st){st.stops.push(s)});
});
$('pickcancel').onclick=function(){pick=null;stage.classList.remove('picking');$('pickhint').hidden=true};
$('btn-play').onclick=function(){fit();setTimeout(play,450)};
$('btn-fit').onclick=fit;

/* ---------- logbook ---------- */
function totals(){
  var st=state.stops,cur=state.current,all=0,done=0;
  for(var i=1;i<st.length;i++){var d=km(st[i-1],st[i]);all+=d;if(i<=cur)done+=d}
  return {all:all,done:done};
}
function dayInfo(){
  var st=state.stops.filter(function(s){return s.date}).map(function(s){return s.date}).sort();
  if(st.length<2)return null;var len=dayDiff(st[0],st[st.length-1])+1,t=todayISO(),d=dayDiff(st[0],t)+1;
  return {len:len,day:d};
}
function renderSub(){
  var st=state.stops,cur=state.current,t=totals(),s;
  if(!st.length)s='Noch keine Route eingetragen';
  else if(cur<0)s=st.length+' Stopps · '+fmtKm(t.all)+' km geplant';
  else s='Etappe '+(cur+1)+' von '+st.length+' · '+fmtKm(t.done)+' km hinter uns';
  $('c-sub').textContent=s;
}
function renderStats(){
  var st=state.stops,cur=state.current,t=totals(),di=dayInfo(),n=st.length;
  var dayHtml='–';
  if(di){ if(di.day<1)dayHtml=(1-di.day)+'<small> Tage bis Start</small>'; else if(di.day>di.len)dayHtml='zurück<small> · '+di.len+' Tage</small>'; else dayHtml=di.day+'<small> / '+di.len+'</small>'; }
  var strip='';
  if(n>1){var pts=st.map(function(s,i){return (i/(n-1))*100});
    var cx=cur<0?0:pts[cur];
    strip='<div class="strip"><svg viewBox="0 0 100 18" preserveAspectRatio="none" aria-hidden="true">'+
      '<line x1="0" y1="9" x2="100" y2="9" stroke="#9A8466" stroke-width="1.2" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>'+
      (cur>0?'<line x1="0" y1="9" x2="'+cx+'" y2="9" stroke="#B3121B" stroke-width="3" vector-effect="non-scaling-stroke"/>':'')+
      '</svg>'+pts.map(function(x,i){return '<span style="position:absolute;left:calc('+x+'% - 4px);top:5px;width:8px;height:8px;border-radius:50%;border:1.4px solid '+(i<=cur?'#5E0A0E':'#33251A')+';background:'+(i<=cur?'#B3121B':'#EFE3C8')+'"></span>'}).join('')+'</div>';}
  $('stats').innerHTML=
    '<div class="stat"><span class="k">Etappe</span><span class="v">'+(cur<0?'0':cur+1)+'<small> / '+n+'</small></span></div>'+
    '<div class="stat"><span class="k">Kilometer</span><span class="v">'+fmtKm(t.done)+'<small> / '+fmtKm(t.all)+'</small></span></div>'+
    '<div class="stat"><span class="k">Reisetag</span><span class="v">'+dayHtml+'</span></div>'+strip;
}
var openEdit=null,armDel=null;
function renderList(){
  var st=state.stops,cur=state.current,ol=$('list');
  if(!st.length){ol.innerHTML='<li class="empty" style="display:block">Noch keine Stopps. Fügt unten euren ersten Ort hinzu.</li>';return}
  ol.innerHTML=st.map(function(s,i){
    var cls=(i<=cur?'done':'')+(i===cur?' current':'');
    var meta=[fmtDate(s.date),i===0?'Start':(MODES[s.mode]||''),i>0?fmtKm(km(st[i-1],s))+' km':'',coord(s)].filter(Boolean).join(' · ');
    var edit=openEdit===s.id?'<div class="edit w">'+
      '<label class="f">Ankunft<input class="i" type="date" id="e-date-'+s.id+'" data-f="date" data-id="'+s.id+'" value="'+esc(s.date)+'"></label>'+
      '<label class="f">Anreise<select class="i" id="e-mode-'+s.id+'" data-f="mode" data-id="'+s.id+'">'+Object.keys(MODES).map(function(m){return '<option value="'+m+'"'+(m===s.mode?' selected':'')+'>'+MODES[m]+'</option>'}).join('')+'</select></label>'+
      '<label class="f full">Ort<input class="i" id="e-name-'+s.id+'" data-f="name" data-id="'+s.id+'" value="'+esc(s.name)+'"></label>'+
      '<label class="f full">Notiz<input class="i" id="e-note-'+s.id+'" data-f="note" data-id="'+s.id+'" value="'+esc(s.note)+'"></label></div>':'';
    return '<li class="'+cls+'" data-key="'+s.id+'"><span class="n">'+String(i+1).padStart(2,'0')+'</span>'+
      '<div><button class="name" type="button" data-act="focus" data-i="'+i+'">'+esc(s.name)+'</button>'+(i===cur?'<span class="here-tag">hier</span>':'')+
      '<div class="meta">'+esc(meta)+'</div>'+(s.note?'<div class="txt">'+esc(s.note)+'</div>':'')+'</div>'+
      '<div class="acts w">'+
        (i===cur?'':'<button class="lnk" type="button" data-act="here" data-i="'+i+'" title="Hier sind wir jetzt">Hier</button>')+
        '<button class="lnk" type="button" data-act="edit" data-i="'+i+'">'+(openEdit===s.id?'Fertig':'Ändern')+'</button>'+
        '<button class="lnk" type="button" data-act="up" data-i="'+i+'" aria-label="Nach oben"'+(i===0?' disabled':'')+'>&uarr;</button>'+
        '<button class="lnk" type="button" data-act="down" data-i="'+i+'" aria-label="Nach unten"'+(i===st.length-1?' disabled':'')+'>&darr;</button>'+
        '<button class="lnk'+(armDel===s.id?' danger':'')+'" type="button" data-act="del" data-i="'+i+'" aria-label="Löschen">'+(armDel===s.id?'Löschen?':'&times;')+'</button>'+
      '</div>'+edit+'</li>';
  }).join('');
}
function renderPanel(){renderStats();renderList();renderSub();$('example').hidden=!state.example}

$('list').addEventListener('click',function(e){
  var b=e.target.closest('button[data-act]');if(!b)return;
  var i=+b.dataset.i,act=b.dataset.act,s=state.stops[i];
  if(act==='focus'){focusStop(i);return}
  if(act==='edit'){openEdit=openEdit===s.id?null:s.id;renderList();return}
  if(act==='here'){change(function(st){st.current=i});return}
  if(act==='up'&&i>0){change(function(st){var x=st.stops.splice(i,1)[0];st.stops.splice(i-1,0,x)});return}
  if(act==='down'&&i<state.stops.length-1){change(function(st){var x=st.stops.splice(i,1)[0];st.stops.splice(i+1,0,x)});return}
  if(act==='del'){
    if(armDel!==s.id){armDel=s.id;renderList();setTimeout(function(){if(armDel===s.id){armDel=null;renderList()}},3500);return}
    armDel=null;change(function(st){st.stops.splice(i,1);if(st.current>=i)st.current=st.current-1;if(st.current<-1)st.current=-1});
  }
});
$('list').addEventListener('change',function(e){
  var t=e.target;if(!t.dataset||!t.dataset.f)return;
  var s=state.stops.find(function(x){return x.id===t.dataset.id});if(!s)return;
  var v=t.value.trim();if(t.dataset.f==='name'&&!v)return;
  change(function(){s[t.dataset.f]=v});
});

$('f-mode').innerHTML=Object.keys(MODES).map(function(m){return '<option value="'+m+'">'+MODES[m]+'</option>'}).join('');
$('places').innerHTML=PLACES.map(function(p){return '<option value="'+esc(p[0])+'"></option>'}).join('');
$('addform').addEventListener('submit',function(e){
  e.preventDefault();
  var name=$('f-name').value.trim();if(!name)return;
  var q=name.toLowerCase(),hit=PLACES.find(function(p){return p[0].toLowerCase()===q})||PLACES.find(function(p){return p[0].toLowerCase().indexOf(q)===0});
  var s={id:uid(),name:hit?hit[0]:name,lat:hit?hit[1]:0,lon:hit?hit[2]:0,date:$('f-date').value,mode:$('f-mode').value,note:$('f-note').value.trim()};
  $('f-name').value='';$('f-note').value='';
  if(hit){change(function(st){st.stops.push(s)});setTimeout(function(){focusStop(state.stops.length-1)},60)}
  else{pick=s;$('pickname').textContent=name;$('pickhint').hidden=false;stage.classList.add('picking');stage.scrollIntoView({behavior:'smooth',block:'start'})}
});
$('ex-keep').onclick=function(){change(function(st){st.example=false})};
var armClear=false;
$('ex-clear').onclick=function(){
  if(!armClear){armClear=true;$('ex-clear').textContent='Wirklich leeren?';setTimeout(function(){armClear=false;$('ex-clear').textContent='Route leeren'},3500);return}
  change(function(st){st.stops=[];st.current=-1;st.example=false});
};

/* ---------- saving: the page is the record ---------- */
var art=null,dirty=false,saving=false,saveTimer=null;
function setStatus(txt,warn){var s=$('status');s.textContent=txt;s.classList.toggle('warn',!!warn)}
function setRO(v){document.body.classList.toggle('ro',v)}
function change(fn){
  fn(state);if(state.current>state.stops.length-1)state.current=state.stops.length-1;
  dirty=true;drawRoute();renderPanel();
  if(art){setStatus('Ungespeichert …');clearTimeout(saveTimer);saveTimer=setTimeout(save,2500)}
  else setStatus('Speichern hier nicht möglich',true);
}
function save(){
  if(!dirty||saving||!art)return;saving=true;setStatus('Speichere …');
  try{sessionStorage.setItem('rl-skip','1')}catch(e){}
  art.publish(buildDoc(state)).then(function(){dirty=false;setStatus('Gespeichert')}).catch(function(e){
    var c=e&&e.code;
    if(c==='conflict')setStatus('Jemand anderes hat gerade gespeichert. Lade neu …',true);
    else if(['not_writer','not_granted','consent_required','capability_disabled','capability_removed','not_declared'].indexOf(c)>=0){setRO(true);setStatus('Nur Ansicht',true)}
    else if(c==='rate_limited'){setStatus('Kurz warten …');setTimeout(save,15000)}
    else setStatus('Speichern fehlgeschlagen. Ändert etwas, um es nochmal zu versuchen.',true);
  }).then(function(){saving=false});
}

setRO(true);
if(window.claude&&window.claude.use){
  Promise.all([window.claude.use('artifact'),window.claude.use('user')]).then(function(r){
    art=r[0];var u=r[1];if(!art)return;
    var p=(u&&u.canEdit)?Promise.resolve().then(function(){return u.canEdit()}).catch(function(){return null}):Promise.resolve(null);
    return p.then(function(can){if(can===false){setStatus('Nur Ansicht');return}setRO(false)});
  }).catch(function(){});
}

/* ---------- boot ---------- */
var skip=false;try{skip=sessionStorage.getItem('rl-skip')==='1';sessionStorage.removeItem('rl-skip')}catch(e){}
renderPanel();
layout();
new ResizeObserver(function(){var r=stage.getBoundingClientRect();if(Math.abs(r.width-W)>2||Math.abs(r.height-H)>2)layout()}).observe(stage);
if(!skip)setTimeout(play,700);
})();
</script>
